{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><h1>Projects</h1><p>One Lookout installation can manage multiple brands or clients.</p></div></div><div class="grid2"><div class="card"><h2>Add project</h2><form method="post"><label>Project / brand name<input name="name" required></label><button>Create project</button></form></div><div class="card"><h2>Your projects</h2>{% for p in projects %}<div class="row"><div><b>{{p.name}}</b><span>{% if project and p.id==project.id %}Active{% endif %}</span></div><div class="toggles"><form method="post" action="{{url_for('web.switch_project',pid=p.id)}}"><button class="secondary">Switch</button></form><form method="post" action="{{url_for('web.project_delete',pid=p.id)}}" onsubmit="var typed=prompt('This permanently deletes {{p.name}} and everything in it: communities, history, knowledge, integrations. Type the project name to confirm.'); if(typed===null)return false; this.confirm_name.value=typed; return typed==={{p.name|tojson}};"><input type="hidden" name="confirm_name" value=""><button class="danger secondary">Delete</button></form></div></div>{% endfor %}</div></div>{% endblock %}
