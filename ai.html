{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><h1>AI Agent</h1><p>Bring your own provider key and define how your community assistant behaves.</p></div></div><div class="grid2"><div class="card"><h2>Provider</h2><form method="post"><input type="hidden" name="mode" value="provider"><label>Provider<select name="provider"><option value="openai" {% if provider and provider.provider=='openai' %}selected{% endif %}>OpenAI</option><option value="anthropic" {% if provider and provider.provider=='anthropic' %}selected{% endif %}>Anthropic</option><option value="gemini" {% if provider and provider.provider=='gemini' %}selected{% endif %}>Google Gemini</option></select></label><label>Model<input name="model" value="{{provider.model if provider else 'gpt-4.1-mini'}}" required></label><label>API key<input name="api_key" type="password" {% if not provider %}required{% endif %} placeholder="{% if provider %}Leave blank to keep current key{% endif %}"></label><button>Save provider</button></form></div><div class="card"><h2>Personality & guardrails</h2><form method="post"><input type="hidden" name="mode" value="agent"><label>Bot name<input name="name" value="{{agent.name}}"></label><label>Tone<input name="tone" value="{{agent.tone}}"></label><label>Preferred terminology<textarea name="preferred_terms">{{agent.preferred_terms}}</textarea></label><label>Words or phrases to avoid<textarea name="forbidden_terms">{{agent.forbidden_terms}}</textarea></label><label>Additional instructions<textarea name="custom_instructions" rows="6">{{agent.custom_instructions}}</textarea></label><label>When unsure<select name="fallback_mode"><option value="escalate">Say it does not know + escalate</option><option value="support">Say it does not know + support route</option><option value="silent">Do not answer</option></select></label><button>Save agent</button></form></div></div>{% endblock %}
