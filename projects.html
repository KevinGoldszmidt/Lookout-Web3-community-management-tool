{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><h1>Projects</h1><p>One Lookout installation can manage multiple brands or clients.</p></div></div><div class="grid2"><div class="card"><h2>Add project</h2><form method="post"><label>Project / brand name<input name="name" required></label><button>Create project</button></form></div><div class="card"><h2>Your projects</h2>{% for p in projects %}<div class="row"><div><b>{{p.name}}</b><span>{% if project and p.id==project.id %}Active{% endif %}</span></div><form method="post" action="{{url_for('web.switch_project',pid=p.id)}}"><button class="secondary">Switch</button></form></div>{% endfor %}</div></div>{% endblock %}
