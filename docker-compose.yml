services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lookout
      POSTGRES_USER: lookout
      POSTGRES_PASSWORD: lookout
    volumes:
      - lookout_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookout -d lookout"]
      interval: 5s
      timeout: 5s
      retries: 10

  init:
    build: .
    command: python -m lookout.init_db
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lookout:lookout@db:5432/lookout}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    command: gunicorn -b 0.0.0.0:8080 --workers 2 --threads 4 --timeout 60 'lookout:create_app()'
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lookout:lookout@db:5432/lookout}
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      init:
        condition: service_completed_successfully

  telegram-worker:
    build: .
    command: python -m lookout.telegram_worker
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lookout:lookout@db:5432/lookout}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      init:
        condition: service_completed_successfully

  scheduler:
    build: .
    command: python -m lookout.scheduler_worker
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lookout:lookout@db:5432/lookout}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  lookout_db:
